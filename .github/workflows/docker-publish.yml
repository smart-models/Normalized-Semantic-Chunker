name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-name: ${{ steps.image-name.outputs.IMAGE_NAME_LOWER }}
      version: ${{ steps.version.outputs.VERSION }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af --volumes

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name and version
        id: image-name
        run: |
          LOWERCASE_IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LOWER=${LOWERCASE_IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.IMAGE_NAME_LOWER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=Normalized Semantic Chunker
            org.opencontainers.image.description=FastAPI semantic chunking service with normalization and CUDA support
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            gpu.cuda=12.6.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Output build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ steps.image-name.outputs.IMAGE_NAME_LOWER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  verify-image:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify versioned image
        run: |
          docker pull ${{ needs.build-and-push.outputs.image-name }}:${{ needs.build-and-push.outputs.version }}
          echo "Versioned image verification successful"

      - name: Pull and verify latest image
        if: ${{ !contains(github.ref, '-') }}
        run: |
          docker pull ${{ needs.build-and-push.outputs.image-name }}:latest
          echo "Latest image verification successful"

      - name: Inspect image
        run: |
          docker inspect ${{ needs.build-and-push.outputs.image-name }}:${{ needs.build-and-push.outputs.version }} --format '{{.Config.Labels}}' | tr ',' '\n'

  cleanup-untagged:
    needs: [build-and-push, verify-image]
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 3
        continue-on-error: true

  create-release:
    needs: [build-and-push, verify-image]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.build-and-push.outputs.version }}
          body: |
            ## Normalized Semantic Chunker - Docker Image Published

            This release publishes a single Docker image with CUDA support that works on both GPU and CPU machines.

            ### Pull the image
            ```bash
            docker pull ${{ needs.build-and-push.outputs.image-name }}:${{ needs.build-and-push.outputs.version }}
            # or
            docker pull ${{ needs.build-and-push.outputs.image-name }}:latest
            ```

            ### Run with GPU (recommended)
            ```bash
            docker run --gpus all -p 8000:8000 ${{ needs.build-and-push.outputs.image-name }}:${{ needs.build-and-push.outputs.version }}
            ```

            ### Run on CPU (fallback)
            ```bash
            docker run -p 8000:8000 ${{ needs.build-and-push.outputs.image-name }}:${{ needs.build-and-push.outputs.version }}
            ```

            ### Docker Compose
            ```bash
            cd docker

            # With GPU
            docker compose --profile gpu up -d

            # CPU only
            docker compose --profile cpu up -d
            ```

            ### Verify installation
            ```bash
            curl http://localhost:8000/
            ```

            For more information, see the [README](https://github.com/${{ github.repository }}/blob/main/README.md).
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
